# Routine updates are grouped: Rust crates monthly, GitHub Actions weekly.
# Actions are pinned by commit SHA, so they get no Dependabot security PRs;
# routine updates are their only automatic fix. CI's MSRV-1.85 matrix gates every bump,
# so a dep that raises the rust floor will fail the PR before it merges.
version: 2
updates:
  # Root crate plus each standalone example. Dependabot's `directory:` only
  # watches the manifest at that path; examples have their own Cargo.toml,
  # so they need their own entries or they'd silently go stale.
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/examples/sample_elf_bin"
      - "/examples/sample_elf_bin_with_lib"
      - "/examples/sample_lib"
      - "/examples/sample_builder_api"
      - "/examples/sample_info_api"
      - "/examples/sample_crashing_process"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch", "minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch", "minor"]
